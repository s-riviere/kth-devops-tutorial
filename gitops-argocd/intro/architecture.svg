<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <rect width="800" height="400" fill="#fff"/>

  <!-- Git -->
  <rect x="20" y="130" width="190" height="120" rx="8" fill="#eef4fb" stroke="#2c6fb7" stroke-width="2"/>
  <text x="115" y="160" text-anchor="middle" font-weight="bold">Git repository</text>
  <text x="115" y="182" text-anchor="middle" font-size="12">gitops/app/</text>
  <text x="115" y="200" text-anchor="middle" font-size="12">deployment.yaml</text>
  <text x="115" y="216" text-anchor="middle" font-size="12">service.yaml</text>
  <text x="115" y="238" text-anchor="middle" font-size="12" font-style="italic">desired state</text>

  <!-- Cluster boundary -->
  <rect x="270" y="20" width="510" height="360" rx="10" fill="none" stroke="#888" stroke-dasharray="6 4"/>
  <text x="290" y="44" fill="#555">Kubernetes cluster (Killercoda VM)</text>

  <!-- Argo CD -->
  <rect x="300" y="70" width="200" height="140" rx="8" fill="#fdf2e9" stroke="#e67e22" stroke-width="2"/>
  <text x="400" y="96" text-anchor="middle" font-weight="bold">Argo CD (ns argocd)</text>
  <text x="400" y="122" text-anchor="middle" font-size="12">repo-server: fetches Git</text>
  <text x="400" y="142" text-anchor="middle" font-size="12">application-controller:</text>
  <text x="400" y="158" text-anchor="middle" font-size="12">compares and syncs</text>
  <text x="400" y="182" text-anchor="middle" font-size="12">argocd-server: web UI</text>
  <text x="400" y="198" text-anchor="middle" font-size="12">(port 8080)</text>

  <!-- Workload -->
  <rect x="570" y="70" width="190" height="140" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="665" y="96" text-anchor="middle" font-weight="bold">ns default</text>
  <text x="665" y="124" text-anchor="middle" font-size="12">Deployment my-app (2 Pods)</text>
  <text x="665" y="146" text-anchor="middle" font-size="12">Service my-app-service</text>
  <text x="665" y="194" text-anchor="middle" font-size="12" font-style="italic">live state</text>

  <!-- Arrows -->
  <path d="M210,170 L300,140" stroke="#333" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="218" y="190" font-size="12">1. pull</text>
  <text x="218" y="206" font-size="11" fill="#555">(~3 min)</text>

  <path d="M500,120 L570,120" stroke="#333" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="505" y="110" font-size="12">3. apply</text>

  <path d="M570,165 L500,165" stroke="#333" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="506" y="182" font-size="12">2. watch</text>

  <!-- Drift -->
  <rect x="570" y="280" width="190" height="70" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="665" y="308" text-anchor="middle" font-weight="bold">You, with kubectl</text>
  <text x="665" y="330" text-anchor="middle" font-size="12">delete / scale = drift</text>
  <path d="M665,280 L665,212" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#r)"/>

  <text x="300" y="260" font-size="12">Desired = Live  ->  Synced</text>
  <text x="300" y="280" font-size="12">Desired != Live ->  OutOfSync, then self-heal (3)</text>
</svg>
